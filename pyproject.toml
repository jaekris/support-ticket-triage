[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ticket-triage"
version = "1.0.0"
description = "AI support ticket triage — classify, score, and route support tickets with Claude."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["llm", "claude", "anthropic", "triage", "support", "fastapi"]

dependencies = [
    "anthropic>=0.40,<1.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
]

[project.scripts]
triage-pipeline = "main:run_pipeline"

[tool.setuptools]
py-modules = ["main", "app"]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]  # line length handled by formatter; long SQL/strings allowed

[tool.mypy]
python_version = "3.11"
files = ["src", "main.py", "app.py"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
